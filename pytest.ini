[pytest]
testpaths = tests
addopts = -v --html=reports/reporte.html --self-contained-html
markers =
    smoke: pruebas críticas del flujo principal
    regression: pruebas de regresión funcional y validación de datos
    security: pruebas básicas de autenticación, autorización y entradas maliciosas
    performance: pruebas no funcionales de tiempo de respuesta
